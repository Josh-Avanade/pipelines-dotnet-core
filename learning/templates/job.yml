parameters:
- name: runGreeting
  type: boolean
  default: false

- name: runBuildInfo
  type: boolean
  default: false

- name: runExplorer
  type: boolean
  default: false

jobs:

- ${{ if eq(parameters.runGreeting, true) }}:
  - job: GreetingJob
    steps:
    - template: Greeting.yml
      parameters:
        name: 'Joshua'

- ${{ if eq(parameters.runBuildInfo, true) }}:
  - job: BuildInfoJob
    steps:
    - template: build-info.yml

- ${{ if eq(parameters.runExplorer, true) }}:
  - job: ExplorerJob
    steps:
    - template: file-explorer.ymlparameters:
