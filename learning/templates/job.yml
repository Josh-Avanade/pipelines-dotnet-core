parameters:
  - name: name
    type: string
  - name: message
    type: string


jobs:
- job: PrintGreeting
  displayName: 'DoAllJob'

  steps:

  - template: Greeting.yml
    parameters:
      name: '${{ parameters.name }}'

  - template: print.yml
    parameters:
      message: 'Hi ${{ parameters.message }}'

  - template: file-explorer.yml

  - template: build-info.yml