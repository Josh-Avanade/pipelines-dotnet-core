stages:

- stage: GreetingStage
  displayName: "Greeting Stage"

  jobs:
  - template: jobs.yml
    parameters:
      runGreeting: true

- stage: InformationStage
  displayName: "Information Stage"

  jobs:
  - template: jobs.yml
    parameters:
      runBuildInfo: true

- stage: ExplorerStage
  displayName: "Explorer Stage"

  jobs:
  - template: jobs.yml
    parameters:
      runExplorer: true