parameters:
- name: userName
  type: string

- name: environment
  type: string
- name: environments
  type: object

stages:

- stage: ObjectTestStage

  jobs:
  - job: ObjectTestJob

    steps:
    - template: object-test.yml
      parameters:
        environments: ${{ parameters.environments }}
- stage: GreetingStage



  condition:  or(eq('${{ parameters.environment }}', 'dev'), eq('${{ parameters.environment }}', 'prod'))
  jobs:
  - job: GreetingJob
  

    steps:
    - template: Greeting.yml
      parameters:
        name: ${{ parameters.userName }}

- stage: BuildInfoStage

  dependsOn: GreetingStage

  condition:  or(eq('${{ parameters.environment }}', 'dev'), eq('${{ parameters.environment }}', 'prod'))

  jobs:
  - job: BuildInfoJob

    steps:
    - template: build-info.yml

- stage: ExplorerStage

  dependsOn: BuildInfoStage

  condition: eq('${{ parameters.environment }}', 'prod')

  jobs:
  - job: ExplorerJob

    steps:
    - template: file-explorer.yml